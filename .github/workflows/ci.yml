name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in the :latest images.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.17.2
  TFLINT_VERSION: v0.66.0
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - name: Validate
        run: |
          for dir in eks kubernetes modules/demo-apps .github/e2e/kind; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done
      - name: Lock files are up to date
        run: git diff --exit-code -- '*.terraform.lock.hcl'
      - run: terraform -chdir=modules/demo-apps test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$(pwd)/.tflint.hcl"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/
      - run: trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 .

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Apply modules/demo-apps to kind
        run: |
          terraform -chdir=.github/e2e/kind init -input=false
          terraform -chdir=.github/e2e/kind apply -auto-approve -input=false
      - name: Check endpoints
        run: |
          kubectl -n demo port-forward service/mvc-app-service 8000:8000 &
          kubectl -n demo port-forward service/rest-api-service 8001:8001 &
          for url in http://localhost:8000/ http://localhost:8000/Demo/List http://localhost:8001/Demo; do
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 10 -o /dev/null "$url"
            echo "OK $url"
          done
      - name: No drift after apply
        run: terraform -chdir=.github/e2e/kind plan -detailed-exitcode -input=false
      - if: failure()
        run: |
          kubectl -n demo get all,events
          kubectl -n demo describe pods
